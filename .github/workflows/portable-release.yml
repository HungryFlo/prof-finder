name: Portable Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform-tag }}
    runs-on: ${{ matrix.os }}
    env:
      PIP_NO_CACHE_DIR: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform-tag: windows-x64
            artifact-glob: dist/portable/*.zip
          - os: macos-14
            platform-tag: macos-arm64
            artifact-glob: dist/portable/*.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<71" poetry pyinstaller
          poetry config virtualenvs.create false
          poetry install --without dev --no-interaction --no-root
          python -m pip install "setuptools<71"
          python -c "import pkg_resources; print('setuptools OK:', pkg_resources.NullProvider)"

      - name: Force CPU-only torch
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys

          freeze = subprocess.check_output(
              [sys.executable, "-m", "pip", "freeze"],
              text=True,
          )
          packages = []
          for line in freeze.splitlines():
              name = line.split("==", 1)[0].lower()
              if name == "torch" or name == "triton" or (name.startswith("nvidia-") and "-cu" in name):
                  packages.append(name)

          if packages:
              subprocess.run(
                  [sys.executable, "-m", "pip", "uninstall", "-y", *packages],
                  check=True,
              )
          PY
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.7.1+cpu"
          python - <<'PY'
          import torch

          print(f"torch={torch.__version__}, cuda={torch.version.cuda}")
          if torch.version.cuda is not None:
              raise SystemExit("Expected CPU-only torch, but CUDA support is present")
          PY

      - name: Install project package
        run: python -m pip install .

      - name: Build portable archive
        run: python scripts/build_portable.py --platform-tag ${{ matrix.platform-tag }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prof-Finder-${{ matrix.platform-tag }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
