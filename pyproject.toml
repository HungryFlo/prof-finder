[tool.poetry]
name = "prof-finder"
version = "0.1.0"
description = "A tool to help students find potential PhD/MPhil supervisors"
authors = ["lanxin-yi <2721783085@qq.com>", "HungryFlo <youhaofeiyang@foxmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "prof_finder", from = "backend"}]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
typer = {extras = ["all"], version = "^0.9.0"}
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
openai = "^1.0.0"
anthropic = "^0.49.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
markdown-it-py = "^3.0.0"
pylatexenc = "^2.10"
rich = "^13.0.0"
scholarly = "^1.7.0"
# scholarly 1.7.x calls httpx.Client(proxies=...), a kwarg removed in httpx 0.28;
# pin below that until scholarly upstream fixes it.
httpx = "<0.28"
pyyaml = "^6.0"
# Web API dependencies
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^5.0.0"
python-multipart = "^0.0.6"
sse-starlette = "^2.0.0"
sentence-transformers = ">=3.0.0"
# SciPy 1.15.x macOS wheels fail dlopen on macOS 27 (__thread_bss zero-fill).
scipy = ">=1.16.0"
modelscope = ">=1.20.0"
numpy = ">=1.24"
huey = "^3.0.0"
crawl4ai = ">=0.6.0"
pypinyin = "^0.53.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^5.0.0"
black = "^23.0.0"
ruff = "^0.6.0"
mypy = "^1.5.0"
pip-licenses = "^5.0.0"

[tool.poetry.scripts]
prof-finder = "prof_finder.cli.main:app"
prof-finder-launcher = "prof_finder.launcher:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"

[tool.coverage.run]
source = ["backend/prof_finder"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
