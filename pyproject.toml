[tool.poetry]
name = "prof-finder"
version = "0.1.0"
description = "A tool to help students find potential PhD/MPhil supervisors"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "prof_finder", from = "backend"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
typer = {extras = ["all"], version = "^0.9.0"}
sqlalchemy = "^2.0.0"
python-dotenv = "^1.0.0"
openai = "^1.0.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
markdown-it-py = "^3.0.0"
pylatexenc = "^2.10"
rich = "^13.0.0"
scholarly = "^1.7.0"
pyyaml = "^6.0"
# Web API dependencies
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
sse-starlette = "^2.0.0"
sentence-transformers = ">=3.0.0"
numpy = ">=1.24"
pymupdf4llm = "^0.3.4"
huey = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.1.0"
mypy = "^1.5.0"

[tool.poetry.scripts]
prof-finder = "prof_finder.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
